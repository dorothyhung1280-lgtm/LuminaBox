<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- 1. PRACTICE GAMES (ABOVE AVATAR) -->
    <section class="practice-games-section">
      <h2>Practice Games</h2>
      <div class="games-grid">
        <button class="game-btn" onclick="startPractice(1)">Game 1: Speed Match</button>
        <button class="game-btn" onclick="startPractice(2)">Game 2: Sequence Memory</button>
        <button class="game-btn" onclick="startPractice(3)">Game 3: Pattern Quest</button>
      </div>
      <div id="game-status" class="status-message">Select a game to begin practice</div>
    </section>

    <!-- 2. AVATAR DISPLAY -->
    <section class="avatar-section">
      <div class="avatar-card">
        <div class="avatar-wrapper">
          <div class="avatar-graphic">👤</div>
        </div>
        <div class="avatar-info">
          <h3>Explorer Avatar</h3>
          <p id="avatar-level">Level 1 • Ready for Action</p>
        </div>
      </div>
    </section>

    <!-- 3. LUMINACODE INPUT & SDG IMAGES -->
    <section class="luminacode-section">
      <h2>LuminaCode & SDG Badges</h2>
      <p class="instruction-text">Enter 4 digits (Each digit must be <strong>1, 2, 3, or 4</strong>):</p>
      
      <div class="code-input-container">
        <input type="number" class="code-digit" id="d1" min="1" max="4" placeholder="1" oninput="validateAndNext(this, 'd2')">
        <input type="number" class="code-digit" id="d2" min="1" max="4" placeholder="1" oninput="validateAndNext(this, 'd3')">
        <input type="number" class="code-digit" id="d3" min="1" max="4" placeholder="1" oninput="validateAndNext(this, 'd4')">
        <input type="number" class="code-digit" id="d4" min="1" max="4" placeholder="1" oninput="validateAndNext(this, null)">
      </div>

      <button class="submit-btn" onclick="submitLuminaCode()">Submit LuminaCode</button>
      <div id="code-feedback" class="feedback-message"></div>

      <!-- SDG IMAGE TILES (USING UPLOADED IMG_ FILES) -->
      <div class="sdg-gallery">
        <h3>SDG Visuals</h3>
        <div class="sdg-grid">
          <div class="sdg-card">
            <img src="IMG_5250.png" alt="SDG Asset IMG_5250" class="sdg-image">
            <span>IMG_5250.png</span>
          </div>
          <div class="sdg-card">
            <img src="IMG_5251.png" alt="SDG Asset IMG_5251" class="sdg-image">
            <span>IMG_5251.png</span>
          </div>
          <div class="sdg-card">
            <img src="IMG_5259.png" alt="SDG Asset IMG_5259" class="sdg-image">
            <span>IMG_5259.png</span>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
